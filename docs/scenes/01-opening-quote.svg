<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1437" />
      <stop offset="100%" stop-color="#1d2b6f" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)" />

  <!-- Stars -->
  <g fill="#fdfcff" opacity="0.65">
    <circle cx="180" cy="120" r="2.5" />
    <circle cx="340" cy="240" r="1.8" />
    <circle cx="520" cy="95" r="3" fill="#39c6f2" />
    <circle cx="780" cy="150" r="2.2" />
    <circle cx="1140" cy="110" r="2.8" fill="#ffd23f" />
    <circle cx="1420" cy="190" r="2" />
    <circle cx="1690" cy="130" r="3.2" />
    <circle cx="1560" cy="340" r="2.2" fill="#39c6f2" />
    <circle cx="260" cy="480" r="2.4" />
    <circle cx="1740" cy="520" r="2.6" />
  </g>

  <!-- Arrakis / Butlerian Eclipse Horizon -->
  <circle cx="960" cy="1460" r="1040" fill="#ff8a3c" opacity="0.16" />
  <circle cx="960" cy="1460" r="1040" fill="none" stroke="#ffd23f" stroke-width="3" opacity="0.45" />
  <circle cx="960" cy="520" r="480" fill="none" stroke="#ff8a3c" stroke-width="2" stroke-dasharray="16 24" opacity="0.22" />

  <!-- Spice Motes -->
  <g fill="#ffd23f" opacity="0.48">
    <circle cx="420" cy="310" r="3.5" />
    <circle cx="610" cy="640" r="4" />
    <circle cx="830" cy="250" r="3" />
    <circle cx="1190" cy="290" r="4.2" />
    <circle cx="1380" cy="610" r="3.2" />
    <circle cx="1510" cy="410" r="3.8" />
  </g>

  <!-- Opening Quote Text -->
  <g font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" transform="translate(960 360)">
    <text y="0" font-size="50" font-weight="800" fill="#fdfcff">
      “Dahulu manusia menyerahkan cara berpikir mereka kepada mesin,
    </text>
    <text y="60" font-size="50" font-weight="800" fill="#fdfcff">
      dengan harapan hal itu akan membebaskan mereka.”
    </text>
    <text y="145" font-size="38" font-weight="600" fill="#ffd23f">
      “Janganlah engkau membuat mesin yang menyerupai akal budi manusia.”
    </text>
    <line x1="-280" y1="195" x2="280" y2="195" stroke="#ff8a3c" stroke-width="4" stroke-linecap="round" />
    <text y="250" font-size="30" font-weight="700" fill="#d9e4ff">
      — Catatan Jihad Butlerian · Kitab Suci Oranye (O.C.B.) · Dune, Frank Herbert (1965) —
    </text>
  </g>
</svg>
