<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1437" />
      <stop offset="100%" stop-color="#4b2a8f" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)" />

  <!-- Stars -->
  <g fill="#fdfcff" opacity="0.6">
    <circle cx="210" cy="140" r="2.5" />
    <circle cx="520" cy="95" r="3" fill="#39c6f2" />
    <circle cx="1390" cy="120" r="2.8" fill="#ffd23f" />
    <circle cx="1710" cy="180" r="2.4" />
  </g>

  <!-- Collaborative Orbit Halo -->
  <circle cx="965" cy="650" r="310" fill="none" stroke="#2ee6c5" stroke-width="4" stroke-dasharray="24 18" opacity="0.35" />

  <!-- Headline -->
  <g font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" transform="translate(960 190)">
    <text y="0" font-size="84" font-weight="800" fill="#fdfcff">AI membantu.</text>
    <text y="100" font-size="84" font-weight="800" fill="#fdfcff">Tanggung jawab tetap milikmu.</text>
  </g>

  <!-- Lit Bulb over Raka -->
  <g transform="translate(820 405)">
