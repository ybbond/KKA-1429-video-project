<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1437" />
      <stop offset="100%" stop-color="#4b2a8f" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)" />

  <!-- Ground -->
  <ellipse cx="960" cy="1240" rx="1540" ry="445" fill="#2ee6c5" opacity="0.12" />
  <ellipse cx="960" cy="1240" rx="1500" ry="420" fill="#0b1437" />

  <!-- Handoff Stream Arc -->
  <path d="M540 580 Q910 260 1260 540" fill="none" stroke="#e8408f" stroke-width="6" stroke-dasharray="18 16" opacity="0.55" />

  <!-- Flying Task Pill ("Keputusan") -->
  <g transform="translate(880 390) rotate(-8)" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif">
    <rect x="-155" y="-42" width="310" height="84" rx="42" fill="#e8408f" />
    <text text-anchor="middle" dominant-baseline="central" font-size="44" font-weight="700" fill="#0b1437">Keputusan</text>
  </g>

  <!-- Shrinking Raka with Dim Bulb -->
