<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e6fb8" />
      <stop offset="100%" stop-color="#a8ecdf" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)" />

  <!-- Sun & Clouds -->
  <circle cx="1720" cy="150" r="115" fill="#ffd23f" opacity="0.28" />
  <circle cx="1720" cy="150" r="80" fill="#ffd23f" />
  <ellipse cx="480" cy="145" rx="110" ry="32" fill="#fdfcff" opacity="0.45" />
  <ellipse cx="1280" cy="110" rx="140" ry="38" fill="#fdfcff" opacity="0.45" />

  <!-- Ground & Tree -->
  <ellipse cx="960" cy="1240" rx="1500" ry="420" fill="#58c96b" />
  <g transform="translate(1560 860) scale(0.9)">
    <rect x="-22" y="-260" width="44" height="260" rx="18" fill="#8a5a3c" />
    <circle cy="-340" r="130" fill="#2f9e62" />
    <circle cx="-90" cy="-260" r="90" fill="#58c96b" />
    <circle cx="90" cy="-270" r="90" fill="#58c96b" />
  </g>

  <!-- Raka -->
  <g transform="translate(260 860)">
    <ellipse rx="68" ry="12" fill="#0b1437" opacity="0.25" />
    <rect x="-42" y="-70" width="30" height="70" rx="15" fill="#0b1437" />
    <rect x="12" y="-70" width="30" height="70" rx="15" fill="#0b1437" />
    <rect x="-72" y="-225" width="144" height="170" rx="60" fill="#ff8a3c" />
    <path d="M-62 -190 Q-108 -130 -84 -78" fill="none" stroke="#ff8a3c" stroke-width="30" stroke-linecap="round" />
    <path d="M62 -190 Q108 -130 84 -78" fill="none" stroke="#ff8a3c" stroke-width="30" stroke-linecap="round" />
    <circle cy="-305" r="85" fill="#ffc9a3" />
    <path d="M-88 -300 A88 88 0 0 1 88 -300 Q30 -345 -88 -300Z" fill="#2b1b4d" />
    <circle cx="-22" cy="-298" r="9" fill="#0b1437" />
    <circle cx="38" cy="-298" r="9" fill="#0b1437" />
    <path d="M-24 -6 Q0 24 24 -6" transform="translate(3 -262)" fill="none" stroke="#0b1437" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Tool Timeline Progression (Cangkul -> Palu -> Komputer -> AI) -->
  <line x1="420" y1="260" x2="1260" y2="260" stroke="#0b1437" stroke-width="8" stroke-dasharray="16 12" opacity="0.45" />
  <g font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#0b1437" text-anchor="middle">
    <!-- Cangkul -->
    <g transform="translate(420 260)">
      <circle r="100" fill="#fdfcff" />
      <path d="M-45 55 L30 -55" fill="none" stroke="#0b1437" stroke-width="12" stroke-linecap="round" />
      <path d="M18 -62 L62 -48 L52 2Z" fill="#0b1437" />
      <text y="160">Cangkul</text>
    </g>
    <!-- Palu -->
    <g transform="translate(700 260)">
      <circle r="100" fill="#fdfcff" />
      <path d="M-35 55 L15 -15" fill="none" stroke="#0b1437" stroke-width="12" stroke-linecap="round" />
      <rect x="-42" y="-24" width="84" height="40" rx="8" fill="#0b1437" transform="translate(22 -24) rotate(35)" />
      <text y="160">Palu</text>
    </g>
    <!-- Komputer -->
    <g transform="translate(980 260)">
      <circle r="100" fill="#fdfcff" />
      <path d="M-40 -40 H40 V20 H-40Z M-55 42 H55" fill="none" stroke="#0b1437" stroke-width="12" stroke-linecap="round" />
      <text y="160">Komputer</text>
    </g>
    <!-- AI -->
    <g transform="translate(1260 260)">
      <circle r="100" fill="#fdfcff" />
      <g transform="translate(0 45) scale(0.35)">
        <rect x="-60" y="-100" width="120" height="100" rx="36" fill="#d9e4ff" />
        <circle cy="-50" r="14" fill="#2ee6c5" />
        <rect x="-4" y="-295" width="8" height="50" fill="#d9e4ff" />
        <circle cy="-302" r="15" fill="#ffd23f" />
        <rect x="-95" y="-250" width="190" height="145" rx="50" fill="#0b1437" />
        <circle cx="-32" cy="-192" r="13" fill="#2ee6c5" />
        <circle cx="32" cy="-192" r="13" fill="#2ee6c5" />
      </g>
      <text y="160">AI</text>
    </g>
  </g>

  <!-- Caption Overlay -->
  <g font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif">
    <rect x="220" y="952" width="1480" height="84" rx="28" fill="#0b1437" opacity="0.86" />
    <text x="960" y="996" text-anchor="middle" dominant-baseline="central" font-size="36" font-weight="600" fill="#fdfcff">
      Dari cangkul hingga komputer, alat selalu menolong kita menjalankan panggilan itu.
    </text>
  </g>
</svg>
